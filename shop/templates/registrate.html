{% load static %}
<html>
    <head>
        <meta charset="utf-8">
        <title>Registrate</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="{% static 'registrate/fonts/material-design-iconic-font/css/material-design-iconic-font.min.css' %}">
        <link rel="stylesheet" href="{% static 'registrate/css/style.css' %}">
    </head>
    <body>
        <div class="wrapper" style="background-image: url('{% static 'registrate/images/bg-registration-form-1.jpg' %}');">
            <div class="inner">
                <div class="image-holder">
                    <img src="{% static 'registrate/images/registration-form-1.jpg' %}" alt="">
                </div>
                <form id="registrationForm" method="post">
                    {% csrf_token %}
                    <h3>Registration Form</h3>
                    <div class="form-group">
                        <input type="text" name="first_name" placeholder="First Name" class="form-control" value="{{ first_name }}" required>
                        <input type="text" name="last_name" placeholder="Last Name" class="form-control" value="{{ last_name }}" required>
                    </div>
                    <div class="form-wrapper">
                        <input type="text" name="email" placeholder="Email Address" class="form-control" value="{{ email }}"required>
                        <i class="zmdi zmdi-email"></i>
                    </div>
                    {% if show_verification_code %}
                    <div class="form-wrapper">
                        <input type="text" name="verification_code" placeholder="Verification Code" class="form-control" value="{{ verification_code }}" required>
                        <i class="zmdi zmdi-check"></i>
                    </div>
                    <div class="resend-container">
                        <span id="timer" style="display: none;">Отправить код повторно можно через 60 секунд</span>
                        <span id="resendCodeText" style="display: none;">Отправить код повторно</span>
                    </div>
                    {% endif %}
                    <div class="form-wrapper">
                        <input type="password" name="password" placeholder="Password" class="form-control" value="{{ password }}" required>
                        <i class="zmdi zmdi-lock" id="togglePassword1" style="cursor: pointer;"></i>
                    </div>
                    <div class="form-wrapper">
                        <input type="password" name="confirm_password" placeholder="Confirm Password" class="form-control" value="{{ confirm_password }}" required>
                        <i class="zmdi zmdi-lock" id="togglePassword2" style="cursor: pointer;"></i>
                    </div>
                    <button type="submit">Register
                        <i class="zmdi zmdi-arrow-right"></i>
                    </button>
                    {% if error %}
                    <div class="error-message">{{ error }}</div> <!-- Сообщение об ошибке -->
                    {% endif %}
                    <div class="link-text">
                        <p>Already have an account? <a href="{% url 'login' %}">Login here</a></p>
                    </div>
                </form>
            </div>
        </div>
        <script src="{% static 'registrate/js/show_passwords.js' %}"></script>
    </body>
</html>
