{% load static %}
<html>
    <head>
        <meta charset="utf-8">
        <title>Login Form</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- MATERIAL DESIGN ICONIC FONT -->
        <link rel="stylesheet" href="{% static 'registrate/fonts/material-design-iconic-font/css/material-design-iconic-font.min.css' %}">

        <!-- STYLE CSS -->
        <link rel="stylesheet" href="{% static 'registrate/css/style.css' %}">
    </head>
    <body>
        <div class="wrapper" style="background-image: url('{% static 'registrate/images/bg-registration-form-1.jpg' %}');">
            <div class="inner">
                <div class="image-holder">
                    <img src="{% static 'registrate/images/registration-form-1.jpg' %}" alt="">
                </div>
                <form id="loginForm" method="post" action="{% url 'login' %}">
                    {% csrf_token %}
                    <h3>Login Form</h3>

                    <!-- Поле для ввода Email -->
                    <div class="form-wrapper">
                        <input type="email" name="email" placeholder="Email Address" class="form-control" required>
                        <i class="zmdi zmdi-email"></i>
                    </div>

                    <!-- Поле для ввода пароля -->
                    <div class="form-wrapper">
                        <input type="password" name="password" placeholder="Password" class="form-control" required>
                        <i class="zmdi zmdi-lock" id="togglePassword1" style="cursor: pointer;"></i>
                    </div>

                    <!-- Кнопка для входа -->
                    <button type="submit" id="loginButton">Login
                        <i class="zmdi zmdi-arrow-right"></i>
                    </button>

                    <!-- Блок для отображения ошибки под кнопкой -->
                    {% if error %}
                        <div class="error-message">{{ error }}</div>
                    {% endif %}

                    <!-- Кликабельный текст -->
                    <div class="link-text">
                        <p>Don't have an account? <a href="{% url 'register' %}">Register here</a></p>
                    </div>
                </form>
            </div>
        </div>
        <script src="{% static 'login/js/show_passwords.js' %}"></script>
    </body>


</html>
