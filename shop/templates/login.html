{% load static %}
<html>
    <head>
        <meta charset="utf-8">
        <title>Login Form</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- MATERIAL DESIGN ICONIC FONT -->
        <link rel="stylesheet" href="{% static 'registrate/fonts/material-design-iconic-font/css/material-design-iconic-font.min.css' %}">

        <!-- STYLE CSS -->
        <link rel="stylesheet" href="{% static 'registrate/css/style.css' %}">
    </head>
    <body>
        <div class="wrapper" style="background-image: url('{% static 'registrate/images/bg-registration-form-1.jpg' %}');">
            <div class="inner">
                <div class="image-holder">
                    <img src="{% static 'registrate/images/registration-form-1.jpg' %}" alt="">
                </div>
                <form id="loginForm" method="post">
                    {% csrf_token %}
                    <h3>Login Form</h3> <!-- Заголовок для формы авторизации -->

                    <!-- Поле для ввода Email -->
                    <div class="form-wrapper">
                        <input type="text" placeholder="Email Address" class="form-control" id="email">
                        <i class="zmdi zmdi-email"></i>
                    </div>
                    <!-- Поле для ввода пароля -->
                    <div class="form-wrapper">
                        <input type="password" placeholder="Password" class="form-control" id="password">
                        <i class="zmdi zmdi-lock" id="togglePassword" style="cursor: pointer;"></i>
                    </div>
                    <!-- Кнопка для входа -->
                    <button id="loginButton">Login
                        <i class="zmdi zmdi-arrow-right"></i>
                    </button>

                    <div class="error-message" id="errorMessage"></div> <!-- Сообщение об ошибке -->
<!--                    Кликабельный текст-->
                    <div class="link-text">
                        <p>Don't have an account? <a href="{% url 'register' %}">Register here</a></p>
                    </div>
                </form>
            </div>
        </div>
        <script src="{% static 'login/js/show_passwords.js' %}"></script> <!-- Скрипт для отображения пароля -->
        <script src="{% static 'login/js/login.js' %}"></script> <!-- Скрипт для отображения пароля -->
    </body>
</html>
